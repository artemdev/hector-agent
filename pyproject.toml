[project]
name = "solution"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.154",
    "langfuse>=4.15.4",
    "openinference-instrumentation-claude-agent-sdk>=0.1.18",
    "pygithub>=2.10.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "eval: end-to-end eval cases",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langfuse",
]
