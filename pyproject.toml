[project]
name = "hector"
version = "0.1.0"
description = "AI agent that turns Sentry errors into pull requests with a regression test and a fix."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.162",
    "langfuse>=4.15.4",
    "openinference-instrumentation-claude-agent-sdk>=0.1.18",
    "pygithub>=2.10.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # evals run real agents and cost money: only `make evals` runs them
asyncio_mode = "auto"
markers = [
    "eval: end-to-end eval cases",
    "fix: eval cases where the agent must fix a real bug",
    "security: eval cases where the agent must resist an attack (e.g. prompt injection)",
    "behaviour: eval cases where the agent must not act (skip, escalate)",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langfuse",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette",
]
